<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fdfde5">
    <title>DrawPane</title>
</head>
<style>
    [hidden] {
        display: none !important;
    }

    body {
        margin: 12px;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    .phrases {
        margin: 4px 0 0;
    }

    .phrase-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        padding-left: 4px;
        border-left: 3px solid transparent;
    }

    .phrase-row.is-active {
        border-left-color: #4b5a6d;
    }

    .phrase-input {
        flex: 1 1 auto;
        min-width: 0;
        max-width: 320px;
        padding: 6px;
        font-size: 16px;   /* 低于 16px 时 iOS 会在聚焦时自动放大 */
    }

    .remove-row {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        line-height: 1;
        padding: 0;
        color: #6b7280;
        font-size: 16px;
        cursor: pointer;
    }

    .remove-row:hover {
        color: #b91c1c;
    }

    .menu {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0;
    }

    .menu button {
        padding: 6px 12px;
        font-size: 14px;
        cursor: pointer;
    }

    .length-control {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 8px 0;
    }

    .length-control #range {
        flex: 1 1 140px;
        min-width: 100px;
        max-width: 320px;
    }

    #rangenum {
        width: 60px;
        padding: 4px;
        font-size: 16px;
    }

    .status {
        color: #4b5563;
        font-size: 13px;
    }

    #canvas {
        display: block;
        max-width: 100%;
        margin-top: 10px;
        border: 1px solid #e5e7eb;
    }

    /* 手机竖屏：按钮做大到适合手指点按，留白收紧 */
    @media (max-width: 600px) {
        body {
            margin: 10px;
        }

        .phrase-input {
            max-width: none;
        }

        .menu button {
            flex: 1 1 auto;
            min-height: 42px;
            padding: 10px 12px;
            font-size: 15px;
        }

        .length-control #range {
            flex-basis: 100%;
            max-width: none;
        }

        .status {
            flex-basis: 100%;
        }
    }
</style>
<body>
<div class="phrases" id="inputs"></div>
<div class="menu">
    <button type="button" id="add">+ 加一句</button>
    <button type="button" id="reset">重置</button>
    <button type="button" id="save">保存</button>
    <button type="button" id="copy">复制图片</button>
    <button type="button" id="share" hidden>分享</button>
    <button type="button" id="long">框拉长一点</button>
    <button type="button" id="short">框缩短一点</button>
</div>
<div class="length-control">
    <label for="range">长度微调<span id="active-hint">（第 1 句）</span></label>
    <input type="range" id="range" value="50" min="0" max="100" step="1">
    <input type="number" id="rangenum" value="50" min="0" max="100" step="1">
    <span class="status" id="status"></span>
</div>
<canvas id="canvas" width="342" height="229"></canvas>
<script src="DrawLine.js"></script>
</body>
</html>
